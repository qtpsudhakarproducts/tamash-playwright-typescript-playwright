<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamash Playwright Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root {
    --bg-base: #0a0e17;
    --bg-surface: #111827;
    --bg-surface-elevated: #1a2234;
    --bg-card: rgba(17, 24, 39, 0.82);
    --bg-input: #1a2234;
    --border: rgba(255, 255, 255, 0.09);
    --border-hover: rgba(255, 255, 255, 0.2);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent: #6366f1;
    --accent-light: #818cf8;
    --accent-glow: rgba(99, 102, 241, 0.25);
    --pass: #10b981;
    --pass-bg: rgba(16, 185, 129, 0.14);
    --pass-border: rgba(16, 185, 129, 0.35);
    --fail: #f43f5e;
    --fail-bg: rgba(244, 63, 94, 0.14);
    --fail-border: rgba(244, 63, 94, 0.35);
    --warn: #f59e0b;
    --warn-bg: rgba(245, 158, 11, 0.14);
    --warn-border: rgba(245, 158, 11, 0.35);
    --skip: #8b5cf6;
    --skip-bg: rgba(139, 92, 246, 0.14);
    --skip-border: rgba(139, 92, 246, 0.35);
    --info: #06b6d4;
    --info-bg: rgba(6, 182, 212, 0.14);
    --blue: #3b82f6;
    --blue-bg: rgba(59, 130, 246, 0.14);
    --row-alt: rgba(255, 255, 255, 0.03);
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.45), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-full: 9999px;
  }

  body.theme-light {
    --bg-base: #f8fafc;
    --bg-surface: #ffffff;
    --bg-surface-elevated: #f1f5f9;
    --bg-card: rgba(255, 255, 255, 0.92);
    --bg-input: #f1f5f9;
    --border: #e2e8f0;
    --border-hover: #cbd5e1;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --accent: #4f46e5;
    --accent-light: #6366f1;
    --accent-glow: rgba(79, 70, 229, 0.15);
    --pass: #059669;
    --pass-bg: #ecfdf5;
    --pass-border: #a7f3d0;
    --fail: #e11d48;
    --fail-bg: #fff1f2;
    --fail-border: #fecdd3;
    --warn: #d97706;
    --warn-bg: #fffbeb;
    --warn-border: #fde68a;
    --skip: #7c3aed;
    --skip-bg: #f5f3ff;
    --skip-border: #ddd6fe;
    --info: #0891b2;
    --info-bg: #ecfeff;
    --blue: #2563eb;
    --blue-bg: #eff6ff;
    --row-alt: rgba(15, 23, 42, 0.03);
    --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 4px 6px -2px rgba(15, 23, 42, 0.04);
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-base);
    color: var(--text-primary);
    min-height: 100vh;
    padding-bottom: 60px;
    transition: background 0.25s ease, color 0.25s ease;
  }

  /* Header */
  .top-navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg-surface);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 12px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    box-shadow: var(--shadow-sm);
  }
  .brand-area {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }
  .brand-title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-name {
    display: inline-flex;
    text-transform: uppercase;
  }
  .brand-name span {
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
  }
  .brand-name .wm-ta { background-image: linear-gradient(160deg, #ffc266 0%, #ff8a00 55%, #e65c00 100%); }
  .brand-name .wm-ma { background-image: linear-gradient(160deg, #6ea8ff 0%, #2450c9 55%, #10286b 100%); }
  .brand-name .wm-sh { background-image: linear-gradient(160deg, #8ce06b 0%, #3aa845 55%, #0c6b1f 100%); }
  .brand-tag {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: var(--radius-full);
    background: var(--accent-glow);
    color: var(--accent-light);
    border: 1px solid var(--accent);
  }
  .navbar-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .nav-tabs {
    display: flex;
    gap: 4px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 4px;
    max-width: 100%;
    overflow-x: auto;
  }
  .nav-tab {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: var(--radius-sm);
    outline: none;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .nav-tab:hover { color: var(--text-primary); }
  .nav-tab.active {
    background: var(--accent);
    color: #fff;
  }
  @media (max-width: 480px) {
    .nav-tab {
      padding: 6px 10px;
      font-size: 12px;
    }
  }
  .btn-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-md);
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-icon:hover {
    color: var(--text-primary);
    border-color: var(--border-hover);
    transform: translateY(-1px);
  }

  /* Container */
  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px 24px 0;
  }

  /* Breadcrumbs */
  .crumbs {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }
  .crumbs a {
    color: var(--accent-light);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.15s ease;
  }
  .crumbs a:hover { text-decoration: underline; }
  .crumbs-separator { color: var(--text-muted); }

  /* Hero Section */
  .hero-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .hero-title h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.6px;
    margin-bottom: 6px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #818cf8 0%, #a78bfa 35%, #c084fc 65%, #f472b6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  body.theme-light .hero-title h1 {
    background: linear-gradient(90deg, #3730a3 0%, #4f46e5 25%, #8b5cf6 55%, #db2777 90%, #e11d48 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }
  .hero-subtitle {
    color: var(--text-secondary);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--pass);
    box-shadow: 0 0 10px var(--pass);
    display: inline-block;
  }

  /* KPI Cards Grid */
  .tiles-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  @media (max-width: 1400px) {
    .tiles-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }
  @media (max-width: 768px) {
    .tiles-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  @media (max-width: 480px) {
    .tiles-grid {
      grid-template-columns: 1fr;
    }
  }
  .tiles-grid.tiles-grid-4 {
    grid-template-columns: repeat(4, 1fr);
  }
  @media (max-width: 1100px) {
    .tiles-grid.tiles-grid-4 {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  @media (max-width: 480px) {
    .tiles-grid.tiles-grid-4 {
      grid-template-columns: 1fr;
    }
  }
  /* Fixed-count tile rows that don't evenly divide the grid (e.g. 4 or 5 tiles)
     center as a group instead of hugging the left edge with empty space on the right. */
  .tiles-grid.tiles-grid-center {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
  }
  .tiles-grid-center .tile-card {
    flex: 1 1 220px;
    max-width: 260px;
  }
  .tile-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow);
    backdrop-filter: blur(8px);
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .tile-card:hover {
    transform: translateY(-2px);
    border-color: var(--border-hover);
  }
  .tile-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--accent-gradient, linear-gradient(90deg, #6366f1, #a855f7));
  }
  .tile-card.pass-card::before { background: var(--pass); }
  .tile-card.fail-card::before { background: var(--fail); }
  .tile-card.warn-card::before { background: var(--warn); }
  .tile-card.skip-card::before { background: var(--skip); }
  .tile-card.info-card::before { background: var(--info); }
  .tile-card.blue-card::before { background: var(--blue); }

  .tile-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .tile-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
  }
  .tile-icon {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-md);
    background: var(--bg-surface-elevated);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
  }
  .tile-icon.icon-pass { background: var(--pass-bg); color: var(--pass); }
  .tile-icon.icon-fail { background: var(--fail-bg); color: var(--fail); }
  .tile-icon.icon-warn { background: var(--warn-bg); color: var(--warn); }
  .tile-icon.icon-skip { background: var(--skip-bg); color: var(--skip); }
  .tile-icon.icon-info { background: var(--info-bg); color: var(--info); }
  .tile-icon.icon-blue { background: var(--blue-bg); color: var(--blue); }
  .tile-value-wrap {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 6px;
  }
  .tile-value {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .tile-delta {
    font-size: 12px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: var(--radius-full);
  }
  .tile-delta.up { background: var(--pass-bg); color: var(--pass); }
  .tile-delta.down { background: var(--fail-bg); color: var(--fail); }
  .tile-sub {
    font-size: 12px;
    color: var(--text-muted);
  }

  /* Panels & Cards */
  .panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(8px);
    position: relative;
    overflow: hidden;
  }
  .panel::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--accent);
  }
  .panel-accent-danger::before { background: var(--fail); }
  .panel-accent-warn::before { background: var(--warn); }
  .panel-accent-alt::before { background: var(--skip); }
  .panel-accent-pass::before { background: var(--pass); }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .panel-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panels-2col {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  .grid-4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }
  @media (max-width: 1200px) {
    .grid-4 { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 640px) {
    .grid-4 { grid-template-columns: 1fr; }
  }
  .panels-2col .panel, .grid-2 .panel {
    margin-bottom: 0;
  }
  @media (max-width: 980px) {
    .panels-2col, .grid-2 { grid-template-columns: 1fr; }
  }

  /* Charts */
  .chart-container {
    position: relative;
    width: 100%;
    overflow: hidden;
  }
  .donut-wrap {
    display: flex;
    align-items: center;
    justify-content: space-around;
    gap: 20px;
    flex-wrap: wrap;
  }
  .donut-legend {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  /* Progress Bars */
  .bar-row {
    margin-bottom: 12px;
    transition: opacity 0.15s ease;
  }
  .bar-row.clickable { cursor: pointer; }
  .bar-row.clickable:hover { opacity: 0.85; }
  .bar-header {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 5px;
  }
  .bar-title {
    font-weight: 600;
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 12px;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 75%;
  }
  .bar-stat {
    font-size: 12px;
    color: var(--text-secondary);
  }
  .bar-track {
    height: 7px;
    background: var(--bg-surface-elevated);
    border-radius: var(--radius-full);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: var(--radius-full);
    transition: width 0.4s ease;
  }

  /* Filter & Search Toolbar */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter-pills {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .pill-btn {
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 6px 12px;
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }
  .pill-btn:hover {
    color: var(--text-primary);
    border-color: var(--border-hover);
  }
  .pill-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 2px 8px var(--accent-glow);
  }
  .pill-count {
    font-size: 10px;
    background: rgba(255, 255, 255, 0.2);
    padding: 1px 6px;
    border-radius: var(--radius-full);
  }
  .search-box {
    position: relative;
    min-width: 240px;
    flex: 1;
    max-width: 380px;
  }
  .search-input {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 7px 12px 7px 32px;
    color: var(--text-primary);
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }

  /* Tables */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    padding: 10px 12px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tr.clickable {
    cursor: pointer;
    transition: background 0.15s ease;
  }
  tr.clickable:hover {
    background: var(--bg-surface-elevated);
  }
  tbody tr:nth-child(even) {
    background: var(--row-alt);
  }
  tr.run-row-pass td:first-child { box-shadow: inset 4px 0 0 var(--pass); }
  tr.run-row-warn td:first-child { box-shadow: inset 4px 0 0 var(--warn); }
  tr.run-row-fail td:first-child { box-shadow: inset 4px 0 0 var(--fail); }

  /* Badges */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    border-radius: var(--radius-full);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .badge-pass { background: var(--pass-bg); color: var(--pass); border: 1px solid var(--pass-border); }
  .badge-fail { background: var(--fail-bg); color: var(--fail); border: 1px solid var(--fail-border); }
  .badge-warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-border); }
  .badge-skip { background: var(--skip-bg); color: var(--skip); border: 1px solid var(--skip-border); }
  .badge-tag {
    background: var(--bg-surface-elevated);
    color: var(--accent-light);
    border: 1px solid var(--border);
    font-size: 11px;
    padding: 2px 7px;
    border-radius: var(--radius-sm);
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-weight: 500;
  }

  /* Spec Accordion / Suite View */
  .suite-group {
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    margin-bottom: 12px;
    overflow: hidden;
    background: var(--bg-surface);
  }
  .suite-header {
    padding: 12px 16px;
    background: var(--bg-surface-elevated);
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s ease;
  }
  .suite-header:hover { background: var(--border-hover); }
  .suite-title-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .suite-icon { color: var(--text-muted); transition: transform 0.2s ease; }
  .suite-icon.open { transform: rotate(90deg); }
  .suite-file-title {
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }
  .suite-stats {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
  }
  .suite-tests {
    display: flex;
    flex-direction: column;
  }
  .suite-test-item {
    padding: 10px 16px 10px 42px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .suite-test-item:hover { background: var(--bg-surface-elevated); }
  .test-title-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 500;
  }

  /* Test Detail View */
  .detail-hero {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .detail-meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .meta-box {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .meta-label {
    font-size: 11px;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }
  .meta-value {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .meta-value.mono {
    font-family: 'JetBrains Mono', Consolas, monospace;
    color: var(--accent-light);
  }

  /* Detail Tabs */
  .tabs-nav {
    display: flex;
    gap: 6px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
    overflow-x: auto;
  }
  .tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 10px 16px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.15s ease;
  }
  .tab-btn:hover { color: var(--text-primary); }
  .tab-btn.active {
    color: var(--accent-light);
    border-bottom-color: var(--accent);
  }

  /* Steps Timeline */
  .step-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    margin-bottom: 8px;
    overflow: hidden;
    transition: border-color 0.15s ease;
  }
  .step-card.failed {
    border-color: var(--fail-border);
    background: var(--fail-bg);
  }
  .step-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    font-size: 13px;
    gap: 12px;
  }
  .step-category {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: var(--radius-sm);
    background: var(--bg-surface-elevated);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .step-locator {
    color: var(--accent-light);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    background: rgba(99, 102, 241, 0.1);
    padding: 2px 6px;
    border-radius: var(--radius-sm);
    margin-left: 6px;
  }
  .step-error-box {
    margin: 0 14px 12px;
    padding: 10px 14px;
    background: rgba(244, 63, 94, 0.12);
    border: 1px solid var(--fail-border);
    border-radius: var(--radius-md);
    color: var(--fail);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    white-space: pre-wrap;
    line-height: 1.5;
  }

  /* Code / Terminal */
  .terminal-box {
    background: #0b0f19;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: var(--radius-md);
    overflow: hidden;
    margin-bottom: 16px;
  }
  .terminal-bar {
    background: #141c2e;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: #94a3b8;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .terminal-dots { display: flex; gap: 6px; }
  .dot-red { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
  .dot-yellow { width: 10px; height: 10px; border-radius: 50%; background: #f59e0b; }
  .dot-green { width: 10px; height: 10px; border-radius: 50%; background: #10b981; }
  .terminal-content {
    padding: 14px;
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 12px;
    line-height: 1.6;
    color: #cbd5e1;
    overflow-x: auto;
    max-height: 420px;
    white-space: pre-wrap;
  }

  /* History dots */
  .dot-trend { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .dot-item {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s ease;
  }
  .dot-item:hover { transform: scale(1.3); }
  .dot-item.active { border-color: #fff; box-shadow: 0 0 8px #fff; }

  /* Utility */
  .copy-btn {
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 11px;
    font-family: inherit;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s ease;
  }
  .copy-btn:hover {
    color: var(--text-primary);
    border-color: var(--border-hover);
  }
  .btn-inspect {
    background: var(--accent-glow);
    border: 1px solid var(--accent);
    color: var(--accent-light);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s ease;
  }
  .btn-inspect:hover {
    background: var(--accent);
    color: #fff;
  }
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding-top: 16px;
    margin-top: 4px;
  }
  .btn-page {
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-page:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent-light);
  }
  .btn-page:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .pagination-info {
    font-size: 12px;
    color: var(--text-muted);
  }
  .empty-state {
    text-align: center;
    padding: 36px 16px;
    color: var(--text-muted);
    font-size: 13px;
  }
  .footer-note {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 40px;
  }

</style>
</head>

<script>

const RUNS = JSON.parse(document.getElementById('run-data').textContent);

let currentTestTitle = '';

const RECENT_RUNS_PAGE_SIZE = 5;

let recentRunsPage = 0;

let currentFilter = 'all';

let currentSearch = '';

let currentViewMode = 'suites'; // 'suites' or 'table'

const EXPLORER_TESTS_PAGE_SIZE = 20;

const EXPLORER_SUITES_PAGE_SIZE = 5;

let explorerPage = 0;

const HEAL_EVENTS_PAGE_SIZE = 15;

let healEventsPage = 0;

const TEST_HEALTH_PAGE_SIZE = 10;

let newlyFailedPage = 0;

let newlyFixedPage = 0;

let stillFailingPage = 0;

let flakyPage = 0;

let activeDetailTab = 'steps';


// Theme management
function initTheme() {
  const saved = localStorage.getItem('pw_dashboard_theme') || 'theme-dark';
  document.body.className = saved;
  updateThemeIcon(saved);
}

function toggleTheme() {
  const isDark = document.body.classList.contains('theme-dark');
  const next = isDark ? 'theme-light' : 'theme-dark';
  document.body.className = next;
  localStorage.setItem('pw_dashboard_theme', next);
  updateThemeIcon(next);
}

function updateThemeIcon(theme) {
  const icon = document.getElementById('themeIcon');
  if (theme === 'theme-light') {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  } else {
    icon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
  }
}
initTheme();


function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtDuration(ms) {
  if (ms == null || isNaN(ms)) return '0ms';
  if (ms >= 60000) return (ms / 60000).toFixed(1) + 'm';
  if (ms >= 1000) return (ms / 1000).toFixed(1) + 's';
  return Math.round(ms) + 'ms';
}

function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function getLatestRun() {
  return RUNS.length ? RUNS[RUNS.length - 1] : null;
}

function copyCurrentTitle(btn) {
  copyText(currentTestTitle, btn);
}

function copyCurrentError(btn) {
  const el = document.getElementById('stackText');
  if (el) copyText(el.textContent, btn);
}

function copyCurrentStdout(btn) {
  const el = document.getElementById('stdoutText');
  if (el) copyText(el.textContent, btn);
}

function copyCurrentStderr(btn) {
  const el = document.getElementById('stderrText');
  if (el) copyText(el.textContent, btn);
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    if (btn) {
      const orig = btn.innerHTML;
      btn.innerHTML = 'Copied!';
      setTimeout(() => btn.innerHTML = orig, 1800);
    }
  });
}

function statusBadge(status, flaky) {
  if (flaky) return '<span class="badge badge-warn"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Flaky</span>';
  if (status === 'passed') return '<span class="badge badge-pass"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg> Passed</span>';
  if (status === 'skipped') return '<span class="badge badge-skip"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg> Skipped</span>';
  return '<span class="badge badge-fail"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> ' + esc(status) + '</span>';
}

function fmtTokens(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
}

function healIndicator(t) {
  if (!t.heals || !t.heals.length) return '';
  const healedCount = t.heals.filter(h => h.healed).length;
  const needsReview = t.heals.some(h => h.healed && h.needsReview);
  const cls = needsReview ? 'badge-warn' : healedCount ? 'badge-pass' : 'badge-fail';
  const label = healedCount ? ('Healed' + (healedCount > 1 ? ' &times;' + healedCount : '')) : 'Heal Failed';
  return ' <span class="badge ' + cls + '" title="Self-healed by tamash-playwright">' +
    '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg> ' + label +
  '</span>';
}

/* Shared pagination control, reused by any long list/table (Recent Runs, Test Suite
   Explorer, All Heal Events, ...). page/totalPages are 0-indexed/1-indexed respectively;
   onChangeFn is the name of a global function taking a single +1/-1 delta argument. */
function renderPagination(page, totalPages, totalItems, itemLabel, onChangeFn, prevLabel, nextLabel) {
  if (totalPages <= 1) return '';
  prevLabel = prevLabel || '&larr; Prev';
  nextLabel = nextLabel || 'Next &rarr;';
  return '<div class="pagination">' +
    '<button class="btn-page" ' + (page === 0 ? 'disabled' : '') + ' onclick="' + onChangeFn + '(-1)">' + prevLabel + '</button>' +
    '<span class="pagination-info">Page ' + (page + 1) + ' of ' + totalPages + ' &middot; ' + totalItems + ' ' + esc(itemLabel) + '</span>' +
    '<button class="btn-page" ' + (page >= totalPages - 1 ? 'disabled' : '') + ' onclick="' + onChangeFn + '(1)">' + nextLabel + '</button>' +
  '</div>';
}


/* Render Circular SVG Progress Gauge */
function renderGauge(pct) {
  const r = 38;
  const c = 2 * Math.PI * r;
  const offset = c - (pct / 100) * c;
  const color = pct === 100 ? 'var(--pass)' : pct >= 60 ? 'var(--warn)' : 'var(--fail)';
  return '<svg width="90" height="90" viewBox="0 0 100 100" style="transform: rotate(-90deg)">' +
    '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="var(--border)" stroke-width="8" />' +
    '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="8" ' +
      'stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '" stroke-linecap="round" ' +
      'style="transition: stroke-dashoffset 0.8s ease;" />' +
  '</svg>';
}

/* Interactive SVG Trend Chart */
function renderTrendChart(runs) {
  const trend = runs.slice(-12);
  const w = 700;
  const h = 180;
  const padX = 36;
  const padY = 24;

  const stepX = trend.length > 1 ? (w - padX * 2) / (trend.length - 1) : 0;
  const coords = trend.map((r, i) => {
    const x = padX + i * stepX;
    const y = padY + (1 - (r.passRate / 100)) * (h - padY * 2);
    return { x, y, r };
  });

  const polyline = coords.map(c => c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
  const areaPath = coords.length
    ? 'M ' + coords[0].x.toFixed(1) + ' ' + (h - padY) + ' L ' + coords.map(c => c.x.toFixed(1) + ' ' + c.y.toFixed(1)).join(' L ') + ' L ' + coords[coords.length - 1].x.toFixed(1) + ' ' + (h - padY) + ' Z'
    : '';

  const circles = coords.map(c => {
    const clr = c.r.passRate === 100 ? 'var(--pass)' : c.r.passRate >= 60 ? 'var(--warn)' : 'var(--fail)';
    const tip = c.r.id + ' - ' + c.r.passRate + '% pass (' + c.r.passed + '/' + c.r.total + ') - ' + fmtTime(c.r.timestamp);
    return '<circle cx="' + c.x.toFixed(1) + '" cy="' + c.y.toFixed(1) + '" r="5" fill="' + clr + '" stroke="var(--bg-surface)" stroke-width="2" style="cursor:pointer" data-run="' + c.r.id + '" onclick="goToRun(this)">' +
      '<title>' + esc(tip) + '</title>' +
    '</circle>';
  }).join('');

  return '<div class="chart-container">' +
    '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '">' +
      '<defs>' +
        '<linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="#6366f1" stop-opacity="0.38"/>' +
          '<stop offset="100%" stop-color="#6366f1" stop-opacity="0.0"/>' +
        '</linearGradient>' +
      '</defs>' +
      '<line x1="' + padX + '" y1="' + padY + '" x2="' + (w - padX) + '" y2="' + padY + '" stroke="var(--border)" stroke-dasharray="3,3" />' +
      '<text x="8" y="' + (padY + 4) + '" fill="var(--text-muted)" font-size="10" font-family="inherit">100%</text>' +
      '<line x1="' + padX + '" y1="' + (padY + (h - padY * 2) * 0.5) + '" x2="' + (w - padX) + '" y2="' + (padY + (h - padY * 2) * 0.5) + '" stroke="var(--border)" stroke-dasharray="3,3" />' +
      '<text x="14" y="' + (padY + (h - padY * 2) * 0.5 + 4) + '" fill="var(--text-muted)" font-size="10" font-family="inherit">50%</text>' +
      '<line x1="' + padX + '" y1="' + (h - padY) + '" x2="' + (w - padX) + '" y2="' + (h - padY) + '" stroke="var(--border)" stroke-dasharray="3,3" />' +
      '<text x="20" y="' + (h - padY + 4) + '" fill="var(--text-muted)" font-size="10" font-family="inherit">0%</text>' +
      (areaPath ? '<path d="' + areaPath + '" fill="url(#trendGrad)" />' : '') +
      (polyline ? '<polyline points="' + polyline + '" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />' : '') +
      circles +
    '</svg>' +
  '</div>';
}

/* Status Breakdown Donut Chart */
function renderStatusDonut(run) {
  const total = run.total || 1;
  const pPassed = (run.passed / total) * 100;
  const pFailed = (run.failed / total) * 100;
  const pFlaky = (run.flaky / total) * 100;
  const pSkipped = (run.skipped / total) * 100;

  const r = 45;
  const c = 2 * Math.PI * r;

  let acc = 0;
  const makeArc = (pct, stroke) => {
    if (pct <= 0) return '';
    const arcLen = (pct / 100) * c;
    const offset = c - acc;
    acc += arcLen;
    return '<circle cx="65" cy="65" r="' + r + '" fill="none" stroke="' + stroke + '" stroke-width="12" stroke-dasharray="' + arcLen + ' ' + (c - arcLen) + '" stroke-dashoffset="' + offset + '" transform="rotate(-90 65 65)" />';
  };

  const arcs = makeArc(pPassed, 'var(--pass)') +
    makeArc(pFailed, 'var(--fail)') +
    makeArc(pFlaky, 'var(--warn)') +
    makeArc(pSkipped, 'var(--skip)');

  return '<div class="donut-wrap">' +
    '<svg width="130" height="130" viewBox="0 0 130 130">' +
      '<circle cx="65" cy="65" r="' + r + '" fill="none" stroke="var(--bg-surface-elevated)" stroke-width="12" />' +
      arcs +
      '<text x="65" y="60" text-anchor="middle" font-size="20" font-weight="800" fill="var(--text-primary)" font-family="inherit">' + run.passRate + '%</text>' +
      '<text x="65" y="76" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-muted)" font-family="inherit">PASS RATE</text>' +
    '</svg>' +
    '<div class="donut-legend">' +
      '<div class="legend-item"><span class="legend-dot" style="background:var(--pass)"></span><span>Passed: <strong>' + run.passed + '</strong> (' + Math.round(pPassed) + '%)</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:var(--fail)"></span><span>Failed: <strong>' + run.failed + '</strong> (' + Math.round(pFailed) + '%)</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:var(--warn)"></span><span>Flaky: <strong>' + run.flaky + '</strong> (' + Math.round(pFlaky) + '%)</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:var(--skip)"></span><span>Skipped: <strong>' + run.skipped + '</strong> (' + Math.round(pSkipped) + '%)</span></div>' +
    '</div>' +
  '</div>';
}

function renderCountTrendChart(points, colorVar) {
  const trend = points.slice(-12);
  const w = 700, h = 160, padX = 36, padY = 20;
  const maxVal = Math.max(1, ...trend.map(p => p.count));
  const stepX = trend.length > 1 ? (w - padX * 2) / (trend.length - 1) : 0;
  const coords = trend.map((p, i) => ({
    x: padX + i * stepX,
    y: padY + (1 - p.count / maxVal) * (h - padY * 2),
    p
  }));
  const polyline = coords.map(c => c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
  const circles = coords.map(c => {
    const tip = c.p.run.id + ': ' + c.p.count;
    return '<circle cx="' + c.x.toFixed(1) + '" cy="' + c.y.toFixed(1) + '" r="4" fill="' + colorVar + '" stroke="var(--bg-surface)" stroke-width="2" style="cursor:pointer" data-run="' + c.p.run.id + '" onclick="goToRun(this)">' +
      '<title>' + esc(tip) + '</title>' +
    '</circle>';
  }).join('');

  return '<div class="chart-container">' +
    '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '">' +
      '<text x="8" y="' + (padY + 4) + '" fill="var(--text-muted)" font-size="10" font-family="inherit">' + maxVal + '</text>' +
      '<line x1="' + padX + '" y1="' + (h - padY) + '" x2="' + (w - padX) + '" y2="' + (h - padY) + '" stroke="var(--border)" stroke-dasharray="3,3" />' +
      '<text x="20" y="' + (h - padY + 4) + '" fill="var(--text-muted)" font-size="10" font-family="inherit">0</text>' +
      (polyline ? '<polyline points="' + polyline + '" fill="none" stroke="' + colorVar + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />' : '') +
      circles +
    '</svg>' +
  '</div>';
}

function renderTokenTrendChart(runs) {
  const trend = runs.slice(-12);
  const w = 700;
  const h = 180;
  const padX = 36;
  const padY = 24;
  const maxTokens = Math.max(1, ...trend.map(r => r.healTokens || 0));

  const stepX = trend.length > 1 ? (w - padX * 2) / (trend.length - 1) : 0;
  const coords = trend.map((r, i) => {
    const x = padX + i * stepX;
    const y = padY + (1 - ((r.healTokens || 0) / maxTokens)) * (h - padY * 2);
    return { x, y, r };
  });

  const polyline = coords.map(c => c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
  const areaPath = coords.length
    ? 'M ' + coords[0].x.toFixed(1) + ' ' + (h - padY) + ' L ' + coords.map(c => c.x.toFixed(1) + ' ' + c.y.toFixed(1)).join(' L ') + ' L ' + coords[coords.length - 1].x.toFixed(1) + ' ' + (h - padY) + ' Z'
    : '';

  const circles = coords.map(c => {
    const tip = c.r.id + ' - ' + fmtTokens(c.r.healTokens || 0) + ' tokens (' + (c.r.healSucceeded || 0) + ' heals) - ' + fmtTime(c.r.timestamp);
    return '<circle cx="' + c.x.toFixed(1) + '" cy="' + c.y.toFixed(1) + '" r="5" fill="var(--warn)" stroke="var(--bg-surface)" stroke-width="2" style="cursor:pointer" data-run="' + c.r.id + '" onclick="goToRun(this)">' +
      '<title>' + esc(tip) + '</title>' +
    '</circle>';
  }).join('');

  return '<div class="chart-container">' +
    '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '">' +
      '<defs>' +
        '<linearGradient id="tokenGrad" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>' +
          '<stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>' +
        '</linearGradient>' +
      '</defs>' +
      '<text x="8" y="' + (padY + 4) + '" fill="var(--text-muted)" font-size="10" font-family="inherit">' + fmtTokens(maxTokens) + '</text>' +
      '<line x1="' + padX + '" y1="' + (h - padY) + '" x2="' + (w - padX) + '" y2="' + (h - padY) + '" stroke="var(--border)" stroke-dasharray="3,3" />' +
      '<text x="20" y="' + (h - padY + 4) + '" fill="var(--text-muted)" font-size="10" font-family="inherit">0</text>' +
      (areaPath ? '<path d="' + areaPath + '" fill="url(#tokenGrad)" />' : '') +
      (polyline ? '<polyline points="' + polyline + '" fill="none" stroke="var(--warn)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />' : '') +
      circles +
    '</svg>' +
  '</div>';
}

function renderCumulativeStatusDonut(stats) {
  const total = stats.totalExecutions || 1;
  const pPassed = (stats.totalPassed / total) * 100;
  const pFailed = (stats.totalFailed / total) * 100;
  const pFlaky = (stats.totalFlaky / total) * 100;
  const pSkipped = (stats.totalSkipped / total) * 100;

  const r = 45;
  const c = 2 * Math.PI * r;

  let acc = 0;
  const makeArc = (pct, stroke) => {
    if (pct <= 0) return '';
    const arcLen = (pct / 100) * c;
    const offset = c - acc;
    acc += arcLen;
    return '<circle cx="65" cy="65" r="' + r + '" fill="none" stroke="' + stroke + '" stroke-width="12" stroke-dasharray="' + arcLen + ' ' + (c - arcLen) + '" stroke-dashoffset="' + offset + '" transform="rotate(-90 65 65)" />';
  };

  const arcs = makeArc(pPassed, 'var(--pass)') +
    makeArc(pFailed, 'var(--fail)') +
    makeArc(pFlaky, 'var(--warn)') +
    makeArc(pSkipped, 'var(--skip)');

  return '<div class="donut-wrap">' +
    '<svg width="130" height="130" viewBox="0 0 130 130">' +
      '<circle cx="65" cy="65" r="' + r + '" fill="none" stroke="var(--bg-surface-elevated)" stroke-width="12" />' +
      arcs +
      '<text x="65" y="60" text-anchor="middle" font-size="20" font-weight="800" fill="var(--text-primary)" font-family="inherit">' + stats.cumulativePassRate + '%</text>' +
      '<text x="65" y="76" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text-muted)" font-family="inherit">ALL RUNS</text>' +
    '</svg>' +
    '<div class="donut-legend">' +
      '<div class="legend-item"><span class="legend-dot" style="background:var(--pass)"></span><span>Passed: <strong>' + stats.totalPassed + '</strong> (' + Math.round(pPassed) + '%)</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:var(--fail)"></span><span>Failed: <strong>' + stats.totalFailed + '</strong> (' + Math.round(pFailed) + '%)</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:var(--warn)"></span><span>Flaky: <strong>' + stats.totalFlaky + '</strong> (' + Math.round(pFlaky) + '%)</span></div>' +
      '<div class="legend-item"><span class="legend-dot" style="background:var(--skip)"></span><span>Skipped: <strong>' + stats.totalSkipped + '</strong> (' + Math.round(pSkipped) + '%)</span></div>' +
    '</div>' +
  '</div>';
}

/* Compute comprehensive metrics across ALL test runs */
function getAllRunsStats() {
  const uniqueSuites = new Set();
  const uniqueTests = new Set();
  let totalExecutions = 0;
  let totalPassed = 0;
  let totalFailed = 0;
  let totalFlaky = 0;
  let totalSkipped = 0;
  let totalDurationMs = 0;

  let healAttempts = 0;
  let healSucceeded = 0;
  let healTokens = 0;
  let healNeedsReviewCount = 0;
  const healedTestKeys = new Set();
  const healedElementKeys = new Set();

  RUNS.forEach(r => {
    totalDurationMs += r.durationMs;
    healAttempts += r.healAttempts || 0;
    healSucceeded += r.healSucceeded || 0;
    healTokens += r.healTokens || 0;
    healNeedsReviewCount += r.healNeedsReviewCount || 0;

    r.tests.forEach(t => {
      uniqueSuites.add(t.file);
      const key = t.file + '|' + t.title;
      uniqueTests.add(key);
      totalExecutions++;
      if (t.status === 'passed') totalPassed++;
      else if (t.status === 'skipped') totalSkipped++;
      else totalFailed++;
      if (t.flaky) totalFlaky++;

      (t.heals || []).forEach(h => {
        if (!h.healed) return;
        healedTestKeys.add(key);
        const elKey = h.sourceLocation || h.initialSelector || h.suggestedSelector;
        if (elKey) healedElementKeys.add(elKey);
      });
    });
  });

  const cumulativePassRate = totalExecutions ? Math.round((totalPassed / totalExecutions) * 100) : 0;

  return {
    totalRuns: RUNS.length,
    uniqueSuitesCount: uniqueSuites.size,
    uniqueTestsCount: uniqueTests.size,
    totalExecutions,
    totalPassed,
    totalFailed,
    totalFlaky,
    totalSkipped,
    cumulativePassRate,
    totalDurationMs,
    avgDurationMs: RUNS.length ? totalDurationMs / RUNS.length : 0,
    healAttempts,
    healSucceeded,
    healTokens,
    healNeedsReviewCount,
    healedTestsCount: healedTestKeys.size,
    healedElementsCount: healedElementKeys.size,
    hasHealingData: healAttempts > 0
  };
}

  const rows = pageRuns.map(r => {

function byFileStats(run) {
  const map = new Map();
  for (const t of run.tests) {
    const stat = map.get(t.file) || { total: 0, passed: 0, failed: 0, skipped: 0, duration: 0, tests: [] };
    stat.total++;
    stat.duration += t.duration;
    stat.tests.push(t);
    if (t.status === 'passed') stat.passed++;
    else if (t.status === 'skipped') stat.skipped++;
    else stat.failed++;
    map.set(t.file, stat);
  }
  return map;
}

function projectStats(run) {
  const map = new Map();
  for (const t of run.tests) {
    const k = t.projectName || 'default';
    const s = map.get(k) || { total: 0, passed: 0, failed: 0 };
    s.total++;
    if (t.status === 'passed') s.passed++;
    else if (t.status !== 'skipped') s.failed++;
    map.set(k, s);
  }
  return map;
}

/* Slowest Tests Component */
function renderSlowest(run, limit = 5) {
  const sorted = [...run.tests].sort((a, b) => b.duration - a.duration).slice(0, limit);
  const maxD = sorted.length ? sorted[0].duration : 1;
  if (!sorted.length) return '<div class="empty-state">No tests recorded.</div>';

  return sorted.map(t => {
    const idx = run.tests.indexOf(t);
    const pct = Math.round((t.duration / maxD) * 100);
    return '<div class="bar-row clickable" data-run="' + run.id + '" data-idx="' + idx + '" onclick="goToTest(this)">' +
      '<div class="bar-header">' +
        '<span class="bar-title">' + esc(t.title) + '</span>' +
        '<span class="bar-stat" style="font-family:JetBrains Mono,monospace">' + fmtDuration(t.duration) + '</span>' +
      '</div>' +
      '<div class="bar-track">' +
        '<div class="bar-fill" style="width:' + pct + '%;background:linear-gradient(90deg,#6366f1,#ec4899)"></div>' +
      '</div>' +
    '</div>';
  }).join('');
}

/* Pass Rate by Project Component */
function renderProjectBars(run) {
  const byProj = projectStats(run);
  return Array.from(byProj.entries()).map(([name, s]) => {
    const pct = s.total ? Math.round((s.passed / s.total) * 100) : 0;
    const clr = pct === 100 ? 'var(--pass)' : pct >= 60 ? 'var(--warn)' : 'var(--fail)';
    return '<div class="bar-row">' +
      '<div class="bar-header">' +
        '<span class="bar-title">' + esc(name) + '</span>' +
        '<span class="bar-stat">' + s.passed + '/' + s.total + ' (' + pct + '%)</span>' +
      '</div>' +
      '<div class="bar-track">' +
        '<div class="bar-fill" style="width:' + pct + '%;background:' + clr + '"></div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function filterTests(tests) {
  return tests.map((t, i) => ({ ...t, _originalIndex: i })).filter((t) => {
    if (currentFilter === 'passed' && t.status !== 'passed') return false;
    if (currentFilter === 'failed' && (t.status === 'passed' || t.status === 'skipped')) return false;
    if (currentFilter === 'flaky' && !t.flaky) return false;
    if (currentFilter === 'skipped' && t.status !== 'skipped') return false;
    if (currentFilter === 'slow' && t.duration < 1500) return false;
    if (currentFilter === 'healed' && !(t.heals && t.heals.length)) return false;

    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      const match = t.title.toLowerCase().includes(q) ||
                    t.file.toLowerCase().includes(q) ||
                    (t.tags && t.tags.some(x => x.toLowerCase().includes(q))) ||
                    (t.error && t.error.toLowerCase().includes(q));
      if (!match) return false;
    }
    return true;
  });
}

/* Interactive Test Suite Explorer (Used on Individual Run View) */
function renderSuiteExplorer(run) {
  const filtered = filterTests(run.tests);
  const counts = {
    all: run.tests.length,
    failed: run.tests.filter(t => t.status !== 'passed' && t.status !== 'skipped').length,
    passed: run.tests.filter(t => t.status === 'passed').length,
    flaky: run.tests.filter(t => t.flaky).length,
    skipped: run.tests.filter(t => t.status === 'skipped').length,
    slow: run.tests.filter(t => t.duration >= 1500).length,
    healed: run.tests.filter(t => t.heals && t.heals.length).length,
  };

  const toolbarHtml = '<div class="toolbar">' +
    '<div class="filter-pills">' +
      '<button class="pill-btn ' + (currentFilter === 'all' ? 'active' : '') + '" data-filter="all" onclick="applyFilter(this)">All <span class="pill-count">' + counts.all + '</span></button>' +
      '<button class="pill-btn ' + (currentFilter === 'failed' ? 'active' : '') + '" data-filter="failed" onclick="applyFilter(this)">Failed <span class="pill-count">' + counts.failed + '</span></button>' +
      '<button class="pill-btn ' + (currentFilter === 'passed' ? 'active' : '') + '" data-filter="passed" onclick="applyFilter(this)">Passed <span class="pill-count">' + counts.passed + '</span></button>' +
      '<button class="pill-btn ' + (currentFilter === 'flaky' ? 'active' : '') + '" data-filter="flaky" onclick="applyFilter(this)">Flaky <span class="pill-count">' + counts.flaky + '</span></button>' +
      '<button class="pill-btn ' + (currentFilter === 'skipped' ? 'active' : '') + '" data-filter="skipped" onclick="applyFilter(this)">Skipped <span class="pill-count">' + counts.skipped + '</span></button>' +
      '<button class="pill-btn ' + (currentFilter === 'slow' ? 'active' : '') + '" data-filter="slow" onclick="applyFilter(this)">Slow (>1.5s) <span class="pill-count">' + counts.slow + '</span></button>' +
      (counts.healed ? '<button class="pill-btn ' + (currentFilter === 'healed' ? 'active' : '') + '" data-filter="healed" onclick="applyFilter(this)">Healed <span class="pill-count">' + counts.healed + '</span></button>' : '') +
    '</div>' +
    '<div style="display:flex;align-items:center;gap:10px">' +
      '<div class="search-box">' +
        '<svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
        '<input type="text" class="search-input" placeholder="Search tests, specs, tags, errors..." value="' + esc(currentSearch) + '" oninput="currentSearch=this.value; explorerPage=0; renderCurrentView()">' +
      '</div>' +
      '<div style="display:flex;gap:4px">' +
        '<button class="btn-icon ' + (currentViewMode === 'suites' ? 'active' : '') + '" data-mode="suites" onclick="applyViewMode(this)" title="Group by Spec File">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>' +
        '</button>' +
        '<button class="btn-icon ' + (currentViewMode === 'table' ? 'active' : '') + '" data-mode="table" onclick="applyViewMode(this)" title="Flat Table View">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>' +
        '</button>' +
      '</div>' +
    '</div>' +
  '</div>';

  if (!filtered.length) {
    return toolbarHtml + '<div class="empty-state">No tests match your filter criteria.</div>';
  }

  if (currentViewMode === 'table') {
    const totalPages = Math.max(1, Math.ceil(filtered.length / EXPLORER_TESTS_PAGE_SIZE));
    explorerPage = Math.min(Math.max(0, explorerPage), totalPages - 1);
    const start = explorerPage * EXPLORER_TESTS_PAGE_SIZE;
    const pageItems = filtered.slice(start, start + EXPLORER_TESTS_PAGE_SIZE);

    const rows = pageItems.map(t => {
      const tagsHtml = (t.tags || []).map(x => '<span class="badge-tag">#' + esc(x) + '</span>').join(' ');
      return '<tr class="clickable" data-run="' + run.id + '" data-idx="' + t._originalIndex + '" onclick="goToTest(this)">' +
        '<td>' + statusBadge(t.status, t.flaky) + healIndicator(t) + '</td>' +
        '<td>' +
          '<div style="font-weight:600">' + esc(t.title) + '</div>' +
          '<div style="font-size:11px;color:var(--text-muted);font-family:JetBrains Mono,monospace">' + esc(t.file) + ':' + t.line + '</div>' +
        '</td>' +
        '<td><span class="badge-tag">' + esc(t.projectName || 'default') + '</span></td>' +
        '<td style="font-family:JetBrains Mono,monospace">' + fmtDuration(t.duration) + '</td>' +
        '<td>' + tagsHtml + '</td>' +
      '</tr>';
    }).join('');

    return toolbarHtml + '<table>' +
      '<thead><tr><th>Status</th><th>Test</th><th>Project</th><th>Duration</th><th>Tags</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>' +
    renderPagination(explorerPage, totalPages, filtered.length, 'tests', 'setExplorerPage');
  }

  // Group by spec file
  const groups = new Map();
  filtered.forEach(t => {
    const list = groups.get(t.file) || [];
    list.push(t);
    groups.set(t.file, list);
  });

  const groupEntries = Array.from(groups.entries());
  const totalSuitePages = Math.max(1, Math.ceil(groupEntries.length / EXPLORER_SUITES_PAGE_SIZE));
  explorerPage = Math.min(Math.max(0, explorerPage), totalSuitePages - 1);
  const suiteStart = explorerPage * EXPLORER_SUITES_PAGE_SIZE;
  const pageGroups = groupEntries.slice(suiteStart, suiteStart + EXPLORER_SUITES_PAGE_SIZE);

  const suitesHtml = pageGroups.map(([file, tests], idx) => {
    const suiteId = 'suite-' + idx;
    const passed = tests.filter(t => t.status === 'passed').length;
    const pct = Math.round((passed / tests.length) * 100);
    const clr = pct === 100 ? 'var(--pass)' : pct >= 60 ? 'var(--warn)' : 'var(--fail)';

    const testRows = tests.map(t => {
      const tagsHtml = (t.tags || []).map(tag => '<span class="badge-tag">#' + esc(tag) + '</span>').join('');
      return '<div class="suite-test-item" data-run="' + run.id + '" data-idx="' + t._originalIndex + '" onclick="goToTest(this)">' +
        '<div class="test-title-line">' +
          statusBadge(t.status, t.flaky) +
          healIndicator(t) +
          '<span style="color:var(--text-primary)">' + esc(t.title) + '</span>' +
          tagsHtml +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:12px">' +
          '<span class="badge-tag">' + esc(t.projectName || 'default') + '</span>' +
          '<span style="font-size:12px;font-family:JetBrains Mono,monospace;color:var(--text-secondary)">' + fmtDuration(t.duration) + '</span>' +
        '</div>' +
      '</div>';
    }).join('');

    return '<div class="suite-group">' +
      '<div class="suite-header" data-suite="' + suiteId + '" onclick="applyToggleSuite(this)">' +
        '<div class="suite-title-wrap">' +
          '<svg id="' + suiteId + '-icon" class="suite-icon open" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>' +
          '<span class="suite-file-title">' + esc(file) + '</span>' +
        '</div>' +
        '<div class="suite-stats">' +
          '<span>' + passed + '/' + tests.length + ' passed (' + pct + '%)</span>' +
          '<div class="bar-track" style="width:70px"><div class="bar-fill" style="width:' + pct + '%;background:' + clr + '"></div></div>' +
        '</div>' +
      '</div>' +
      '<div id="' + suiteId + '" class="suite-tests" style="display:flex">' +
        testRows +
      '</div>' +
    '</div>';
  }).join('');

  return toolbarHtml + suitesHtml + renderPagination(explorerPage, totalSuitePages, groupEntries.length, 'spec files', 'setExplorerPage');
}

function setExplorerPage(delta) {
  explorerPage += delta;
  renderCurrentView();
}

/* TEST DETAIL VIEW */
function renderTest(runId, idx) {
  const run = RUNS.find(r => r.id === runId);
  const test = run && run.tests[idx];
  if (!run || !test) {
    return '<div class="empty-state">Test record not found. <br><br><a href="#">&larr; Back to dashboard</a></div>';
  }

  // History dots across all runs
  const testKey = test.file + '|' + test.title;
  const historyOccurrences = [];
  RUNS.forEach(r => {
    const foundIdx = r.tests.findIndex(t => (t.file + '|' + t.title) === testKey);
    if (foundIdx !== -1) {
      historyOccurrences.push({ run: r, idx: foundIdx, test: r.tests[foundIdx] });
    }
  });

  const dotItems = historyOccurrences.map(h => {
    const clr = h.test.status === 'passed' ? 'var(--pass)' : h.test.status === 'skipped' ? 'var(--warn)' : 'var(--fail)';
    const isActive = h.run.id === run.id;
    const tip = h.run.id + ' - ' + h.test.status + ' (' + fmtDuration(h.test.duration) + ')';
    return '<div class="dot-item ' + (isActive ? 'active' : '') + '" style="background:' + clr + '" ' +
      'data-run="' + h.run.id + '" data-idx="' + h.idx + '" onclick="goToTest(this)" title="' + esc(tip) + '"></div>';
  }).join('');

  // Steps
  const stepsHtml = test.steps && test.steps.length
    ? test.steps.map(s => {
        const failedClass = s.status === 'failed' ? 'failed' : '';
        const locatorHtml = s.locator ? '<span class="step-locator">' + esc(s.locator) + '</span>' : '';
        const errorBox = s.error ? '<div class="step-error-box">' + esc(s.error) + '</div>' : '';
        return '<div class="step-card ' + failedClass + '" style="margin-left:' + (s.depth * 18) + 'px">' +
          '<div class="step-header">' +
            '<div style="display:flex;align-items:center;gap:8px;flex:1;overflow:hidden">' +
              '<span class="step-category">' + esc(s.category) + '</span>' +
              '<span style="font-weight:600;color:var(--text-primary)">' + esc(s.title) + '</span>' +
              locatorHtml +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:10px">' +
              '<span style="font-size:11px;color:var(--text-muted);font-family:JetBrains Mono,monospace">' + fmtDuration(s.duration) + '</span>' +

/* Failing/Flaky Watchlist (Multi-Run) */
/* Test Health: unified Newly Failed / Newly Fixed / Still Failing / Flaky computation.
   Newly Failed and Still Failing are mutually exclusive (split on whether the previous run
   was already failing); Flaky is an independent, orthogonal signal windowed to recent runs,
   so a test can appear there alongside one of the other three without double-meaning. */
function testKeyOf(t) { return t.file + '|' + t.title; }

function computeConsecutiveFailStreak(key, runs) {
  let streak = 0;
  let sinceRun = null;
  for (let i = runs.length - 1; i >= 0; i--) {
    const t = runs[i].tests.find(x => testKeyOf(x) === key);
    if (!t) break;
    const failing = t.status !== 'passed' && t.status !== 'skipped';
    if (!failing) break;
    streak++;
    sinceRun = runs[i];
  }
  return { streak, sinceRun };
}

function computeTestHealth(runs) {
  const empty = { newlyFailed: [], newlyFixed: [], stillFailing: [], flaky: [], hasPrev: false, currRunId: null };
  if (!runs.length) return empty;
  const curr = runs[runs.length - 1];
  const prev = runs.length >= 2 ? runs[runs.length - 2] : null;
  const prevMap = prev ? new Map(prev.tests.map(t => [testKeyOf(t), t])) : new Map();

  const newlyFailed = [];
  const newlyFixed = [];
  const stillFailing = [];

  if (prev) {
    curr.tests.forEach((t, i) => {
      const key = testKeyOf(t);
      const currFail = t.status !== 'passed' && t.status !== 'skipped';
      const p = prevMap.get(key);
      const prevFail = p ? (p.status !== 'passed' && p.status !== 'skipped') : null;

      if (currFail) {
        if (prevFail === true) {
          const { streak, sinceRun } = computeConsecutiveFailStreak(key, runs);
          stillFailing.push({ t, i, streak, sinceRun });
        } else {
          newlyFailed.push({ t, i });
        }
      } else if (prevFail === true) {
        newlyFixed.push({ t, i });
      }
    });
    stillFailing.sort((a, b) => b.streak - a.streak);
  }

  const window = runs.slice(-10);
  const flakyMap = new Map();
  window.forEach(r => {
    r.tests.forEach((t, i) => {
      if (!t.flaky) return;
      const key = testKeyOf(t);
      const e = flakyMap.get(key) || { file: t.file, title: t.title, count: 0, lastRunId: null, lastIdx: null, projectName: t.projectName, duration: t.duration };
      e.count++;
      e.lastRunId = r.id;
      e.lastIdx = i;
      e.projectName = t.projectName;
      e.duration = t.duration;
      flakyMap.set(key, e);
    });
  });
  const flaky = Array.from(flakyMap.values()).sort((a, b) => b.count - a.count);

  return { newlyFailed, newlyFixed, stillFailing, flaky, hasPrev: !!prev, currRunId: curr.id };
}

function healthTableRow(t, i, runId, detailHtml) {
  return '<tr class="clickable" data-run="' + runId + '" data-idx="' + i + '" onclick="goToTest(this)">' +
    '<td><span class="badge-tag">' + esc(runId) + '</span></td>' +
    '<td>' +
      '<div style="font-weight:600">' + esc(t.title) + '</div>' +
      '<div style="font-size:11px;color:var(--text-muted);font-family:JetBrains Mono,monospace">' + esc(t.file) + '</div>' +
    '</td>' +
    '<td><span class="badge-tag">' + esc(t.projectName || 'default') + '</span></td>' +
    '<td style="font-family:JetBrains Mono,monospace">' + fmtDuration(t.duration) + '</td>' +
    '<td>' + detailHtml + '</td>' +
  '</tr>';
}

function renderHealthTable(label, colorVar, panelClass, items, rowFn, detailLabel, emptyMsg, page, setPageFnName) {
  if (!items.length) {
    return '<div class="panel ' + panelClass + '">' +
      '<div class="panel-header" style="margin-bottom:12px"><span class="panel-title" style="color:' + colorVar + '">' + esc(label) + ' (0)</span></div>' +
      '<table>' +
        '<thead><tr><th>Run</th><th>Test</th><th>Project</th><th>Duration</th><th>' + esc(detailLabel) + '</th></tr></thead>' +
        '<tbody><tr><td colspan="5"><div class="empty-state">' + esc(emptyMsg) + '</div></td></tr></tbody>' +
      '</table>' +
    '</div>';
  }

  const totalPages = Math.max(1, Math.ceil(items.length / TEST_HEALTH_PAGE_SIZE));
  const clampedPage = Math.min(Math.max(0, page), totalPages - 1);
  const start = clampedPage * TEST_HEALTH_PAGE_SIZE;
  const rows = items.slice(start, start + TEST_HEALTH_PAGE_SIZE).map(rowFn).join('');

  return '<div class="panel ' + panelClass + '">' +
    '<div class="panel-header" style="margin-bottom:12px">' +
      '<span class="panel-title" style="color:' + colorVar + '">' + esc(label) + ' (' + items.length + ')</span>' +
    '</div>' +
    '<table>' +
      '<thead><tr><th>Run</th><th>Test</th><th>Project</th><th>Duration</th><th>' + esc(detailLabel) + '</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>' +
    renderPagination(clampedPage, totalPages, items.length, label.toLowerCase(), setPageFnName) +
  '</div>';
}

function setNewlyFailedPage(delta) { newlyFailedPage += delta; renderCurrentView(); }
function setNewlyFixedPage(delta) { newlyFixedPage += delta; renderCurrentView(); }
function setStillFailingPage(delta) { stillFailingPage += delta; renderCurrentView(); }
function setFlakyPage(delta) { flakyPage += delta; renderCurrentView(); }

function healthTile(label, value, cardClass, iconClass, iconPath, sub, clickable) {
  return '<div class="tile-card ' + cardClass + '"' + (clickable ? ' style="cursor:pointer" onclick="goToHealth()"' : '') + '>' +
    '<div class="tile-top">' +
      '<span class="tile-label">' + esc(label) + '</span>' +
      '<div class="tile-icon ' + iconClass + '">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' + iconPath + '</svg>' +
      '</div>' +
    '</div>' +
    '<div class="tile-value-wrap"><span class="tile-value">' + value + '</span></div>' +
    '<div class="tile-sub">' + esc(sub) + '</div>' +
  '</div>';
}

function renderTestHealthTiles(health, clickable) {
  if (!health.hasPrev) {
    return '<div class="empty-state">Need at least 2 test executions to compare regressions and recoveries. Run the suite again!</div>';
  }
  return '<div class="tiles-grid tiles-grid-center">' +
    healthTile('Newly Failed', health.newlyFailed.length, 'fail-card', 'icon-fail',
      '<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>',
      'Regressed since the previous run', clickable) +
    healthTile('Newly Fixed', health.newlyFixed.length, 'pass-card', 'icon-pass',
      '<path d="M20 6 9 17l-5-5"/>',
      'Recovered since the previous run', clickable) +
    healthTile('Still Failing', health.stillFailing.length, 'fail-card', 'icon-fail',
      '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
      'Chronic, multi-run failures', clickable) +
    healthTile('Flaky', health.flaky.length, 'warn-card', 'icon-warn',
      '<path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>',
      'Inconsistent across last 10 runs', clickable) +
  '</div>';
}

function computeNewlyFailedPerRunTrend(runs) {
  const points = [];
  for (let i = 1; i < runs.length; i++) {
    const prevMap = new Map(runs[i - 1].tests.map(t => [testKeyOf(t), t]));
    let count = 0;
    runs[i].tests.forEach(t => {
      const currFail = t.status !== 'passed' && t.status !== 'skipped';
      if (!currFail) return;
      const p = prevMap.get(testKeyOf(t));
      const prevFail = p ? (p.status !== 'passed' && p.status !== 'skipped') : false;
      if (!prevFail) count++;
    });
    points.push({ run: runs[i], count });
  }
  return points;
}

function computeFlakyPerRunTrend(runs) {
  return runs.map(r => ({ run: r, count: r.tests.filter(t => t.flaky).length }));
}

/* Dedicated Test Health analytics page: uncapped lists + trend charts over time */
function renderTestHealthPage() {
  const health = computeTestHealth(RUNS);

  const failedRow = ({ t, i }) => healthTableRow(t, i, health.currRunId, statusBadge(t.status, false) + healIndicator(t));
  const fixedRow = ({ t, i }) => healthTableRow(t, i, health.currRunId, statusBadge(t.status, false) + healIndicator(t));
  const stillRow = ({ t, i, streak, sinceRun }) => healthTableRow(t, i, health.currRunId,
    '<span class="badge badge-fail">' + streak + ' runs</span>' + (sinceRun ? ' <span style="color:var(--text-muted);font-size:11px">since ' + esc(sinceRun.id) + '</span>' : '')
  );
  const flakyRow = (e) => healthTableRow(
    { file: e.file, title: e.title, projectName: e.projectName, duration: e.duration },
    e.lastIdx, e.lastRunId,
    '<span class="badge badge-warn">' + e.count + '&times; in last 10 runs</span>'
  );

  const body = !health.hasPrev
    ? '<div class="empty-state">Need at least 2 test executions to compute test health.</div>'
    : (
      renderTestHealthTiles(health, false) +
      '<div class="panels-2col">' +
        '<div class="panel panel-accent-danger">' +
          '<div class="panel-header"><span class="panel-title">Newly Failing per Run</span></div>' +
          renderCountTrendChart(computeNewlyFailedPerRunTrend(RUNS), 'var(--fail)') +
        '</div>' +
        '<div class="panel panel-accent-warn">' +
          '<div class="panel-header"><span class="panel-title">Flaky Occurrences per Run</span></div>' +
          renderCountTrendChart(computeFlakyPerRunTrend(RUNS), 'var(--warn)') +
        '</div>' +
      '</div>' +
      renderHealthTable('Newly Failed', 'var(--fail)', 'panel-accent-danger', health.newlyFailed, failedRow, 'Status', 'No new regressions since the previous run.', newlyFailedPage, 'setNewlyFailedPage') +
      renderHealthTable('Newly Fixed', 'var(--pass)', 'panel-accent-pass', health.newlyFixed, fixedRow, 'Status', 'No newly fixed tests this run.', newlyFixedPage, 'setNewlyFixedPage') +
      renderHealthTable('Still Failing', 'var(--fail)', 'panel-accent-danger', health.stillFailing, stillRow, 'Streak', 'No ongoing failures.', stillFailingPage, 'setStillFailingPage') +
      renderHealthTable('Flaky', 'var(--warn)', 'panel-accent-warn', health.flaky, flakyRow, 'Occurrences', 'No flaky tests in the last 10 runs.', flakyPage, 'setFlakyPage')
    );

  return '<div class="crumbs">' +
    '<a href="#">&larr; All Runs Dashboard</a>' +
    '<span class="crumbs-separator">/</span>' +
    '<span>Test Health Analytics</span>' +
  '</div>' +
  '<div class="hero-header">' +
    '<div class="hero-title">' +
      '<h1 style="text-transform:none;background:none;-webkit-background-clip:unset;color:var(--text-primary)">Test Health Analytics</h1>' +
      '<p class="hero-subtitle">Full regressions, recoveries, chronic failures, and flakiness across all recorded history</p>' +
    '</div>' +
  '</div>' +
  body;
}


/* Self-Healing (tamash-playwright) Metrics */
function renderHealingTiles(stats) {
  const avgTokens = stats.healAttempts ? Math.round(stats.healTokens / stats.healAttempts) : 0;
  return '<div class="tiles-grid tiles-grid-center">' +
    '<div class="tile-card info-card">' +
      '<div class="tile-top">' +
        '<span class="tile-label">Tests Healed</span>' +
        '<div class="tile-icon icon-info">' +
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>' +
        '</div>' +
      '</div>' +
      '<div class="tile-value-wrap"><span class="tile-value">' + stats.healedTestsCount + '</span></div>' +
      '<div class="tile-sub">Distinct tests self-healed at least once</div>' +
    '</div>' +

    '<div class="tile-card blue-card">' +
      '<div class="tile-top">' +
        '<span class="tile-label">Elements Healed</span>' +
        '<div class="tile-icon icon-blue">' +
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>' +
        '</div>' +
      '</div>' +
      '<div class="tile-value-wrap"><span class="tile-value">' + stats.healedElementsCount + '</span></div>' +
      '<div class="tile-sub">Distinct locators self-healed</div>' +
    '</div>' +

    '<div class="tile-card skip-card">' +
      '<div class="tile-top">' +
        '<span class="tile-label">Total Heals</span>' +
        '<div class="tile-icon icon-skip">' +
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>' +
        '</div>' +
      '</div>' +
      '<div class="tile-value-wrap"><span class="tile-value">' + stats.healSucceeded + '</span></div>' +
      '<div class="tile-sub">' + stats.healAttempts + ' attempt(s) &middot; ' + stats.healNeedsReviewCount + ' need review</div>' +
    '</div>' +

    '<div class="tile-card warn-card">' +
      '<div class="tile-top">' +
        '<span class="tile-label">Total Tokens</span>' +
        '<div class="tile-icon icon-warn">' +
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>' +
        '</div>' +
      '</div>' +
      '<div class="tile-value-wrap"><span class="tile-value">' + fmtTokens(stats.healTokens) + '</span></div>' +
      '<div class="tile-sub">Spent by the self-healer across all runs</div>' +
    '</div>' +

    '<div class="tile-card">' +
      '<div class="tile-top">' +
        '<span class="tile-label">Avg Tokens / Heal</span>' +
        '<div class="tile-icon">' +
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18.7 8 13 13.7l-4-4L3 16"/></svg>' +
        '</div>' +
      '</div>' +
      '<div class="tile-value-wrap"><span class="tile-value">' + fmtTokens(avgTokens) + '</span></div>' +
      '<div class="tile-sub">Per heal attempt, successful or not</div>' +
    '</div>' +
  '</div>';
}

/* Dedicated Self-Healing analytics page: full heal event history across all runs */
function computeHealingEvents(runs) {
  const events = [];
  runs.slice().reverse().forEach(r => {
    r.tests.forEach((t, i) => {
      (t.heals || []).forEach(h => {
        events.push({
          runId: r.id,
          idx: i,
          file: t.file,
          title: t.title,
          projectName: t.projectName,
          action: h.action,
          selector: h.suggestedSelector || h.initialSelector || h.sourceLocation || '',
          tokens: (h.tokenUsage && h.tokenUsage.totalTokens) || 0,
          healed: h.healed,
          needsReview: !!h.needsReview
        });
      });
    });
  });
  return events;
}

function healingTableRow(e) {
  const statusHtml = e.needsReview
    ? '<span class="badge badge-warn">Needs Review</span>'
    : e.healed
      ? '<span class="badge badge-pass">Healed</span>'
      : '<span class="badge badge-fail">Heal Failed</span>';
  return '<tr class="clickable" data-run="' + e.runId + '" data-idx="' + e.idx + '" onclick="goToTest(this)">' +
    '<td><span class="badge-tag">' + esc(e.runId) + '</span></td>' +
    '<td>' +
      '<div style="font-weight:600">' + esc(e.title) + '</div>' +
      '<div style="font-size:11px;color:var(--text-muted);font-family:JetBrains Mono,monospace">' + esc(e.file) + '</div>' +
    '</td>' +
    '<td><span class="badge-tag">' + esc(e.projectName || 'default') + '</span></td>' +
    '<td style="font-family:JetBrains Mono,monospace;font-size:12px">' + esc(e.selector || e.action || '&mdash;') + '</td>' +
    '<td style="font-family:JetBrains Mono,monospace">' + fmtTokens(e.tokens) + '</td>' +
    '<td>' + statusHtml + '</td>' +
  '</tr>';
}

function setHealEventsPage(delta) {
  healEventsPage += delta;
  renderCurrentView();
}

function renderHealingTable(events) {
  if (!events.length) {
    return '<table>' +
      '<thead><tr><th>Run</th><th>Test</th><th>Project</th><th>Element / Action</th><th>Tokens</th><th>Status</th></tr></thead>' +
      '<tbody><tr><td colspan="6"><div class="empty-state">No self-healing activity recorded yet.</div></td></tr></tbody>' +
    '</table>';
  }

  const totalPages = Math.max(1, Math.ceil(events.length / HEAL_EVENTS_PAGE_SIZE));
  healEventsPage = Math.min(Math.max(0, healEventsPage), totalPages - 1);
  const start = healEventsPage * HEAL_EVENTS_PAGE_SIZE;
  const pageEvents = events.slice(start, start + HEAL_EVENTS_PAGE_SIZE);
  const rows = pageEvents.map(healingTableRow).join('');

  return '<table>' +
    '<thead><tr><th>Run</th><th>Test</th><th>Project</th><th>Element / Action</th><th>Tokens</th><th>Status</th></tr></thead>' +
    '<tbody>' + rows + '</tbody>' +
  '</table>' +
  renderPagination(healEventsPage, totalPages, events.length, 'heal events', 'setHealEventsPage');
}

function renderSelfHealingPage() {
  const stats = getAllRunsStats();

  const body = !stats.hasHealingData
    ? '<div class="empty-state">No self-healing activity recorded yet. Add <a href="https://www.npmjs.com/package/tamash-playwright" style="color:var(--accent-light)">tamash-playwright</a> to your project to see heal metrics here.</div>'
    : (
      renderHealingTiles(stats) +
      '<div class="panel panel-accent-warn">' +
        '<div class="panel-header"><span class="panel-title">Token Usage Across Runs (Last ' + Math.min(RUNS.length, 12) + ' Runs)</span></div>' +
        renderTokenTrendChart(RUNS) +
      '</div>' +
      '<div class="panel">' +
        '<div class="panel-header"><span class="panel-title">All Heal Events (' + computeHealingEvents(RUNS).length + ')</span></div>' +
        renderHealingTable(computeHealingEvents(RUNS)) +
      '</div>'
    );

  return '<div class="crumbs">' +
    '<a href="#">&larr; All Runs Dashboard</a>' +
    '<span class="crumbs-separator">/</span>' +
    '<span>Self-Healing Analytics</span>' +
  '</div>' +
  '<div class="hero-header">' +
    '<div class="hero-title">' +
      '<h1 style="text-transform:none;background:none;-webkit-background-clip:unset;color:var(--text-primary)">Self-Healing Analytics</h1>' +
      '<p class="hero-subtitle">Full heal history &mdash; costs, elements, and outcomes across all recorded runs</p>' +
    '</div>' +
  '</div>' +
  body;
}


window.addEventListener('hashchange', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
  renderCurrentView();
});

renderCurrentView();

</script>
