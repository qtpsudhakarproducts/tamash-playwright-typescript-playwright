name: Playwright Tests
on:
  # No branch filter here on purpose — people push and heal on their own feature branches too,
  # not just main/master. apply-heals below opens its PR against whichever branch triggered the
  # run (see that job's checkout/branch naming), and publish-report is separately restricted to
  # main/master only, since the public Pages site should reflect the trunk, not every feature push.
  push:
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # Self-healing config — plain values, nothing sensitive here.
      HEALER_ENABLED: true
      HEALER_PROVIDER: ollama
      OLLAMA_MODEL: gpt-oss:120b
      APP_BASE_URL: https://qtpsudhakar-vibetestq-hrm.up.railway.app/
      # The actual credential — set via `gh secret set OLLAMA_API_KEY`, never committed.
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Upload self-healing log
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: heals-log
        path: .tamash-playwright/heals.jsonl
        if-no-files-found: ignore
        retention-days: 7

  apply-heals:
    # Only on push — not on pull_request runs, which can come from forks with a read-only
    # GITHUB_TOKEN (so they couldn't open a PR anyway), and where "open a PR to fix this still-open
    # PR" isn't a sensible flow. Runs on ANY branch, not just main/master — checkout below follows
    # whichever branch triggered the run, and the heal branch/PR is named after that source branch
    # (see "Open PR with healed selectors") so it targets that same branch, not main/master. Runs
    # are always sequenced single-shard here since this repo doesn't shard (playwright.config.ts
    # intentionally runs single-worker against the shared OrangeHRM demo), but the --logs-dir merge
    # below is written to scale to sharded suites too — see the "Running apply-heals in CI" section
    # of tamash-playwright's own README.
    needs: test
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Two pushes close together would otherwise race on the same tamash-playwright/apply-heals
    # branch/PR — whichever push finished last could clobber the other mid-update. Queues instead
    # (never cancels an in-progress run) so each one always starts from a clean, fully-finished
    # state and checks out master fresh at that point, rather than fighting over the same ref.
    concurrency:
      group: apply-heals-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci

    - name: Download self-healing log
      uses: actions/download-artifact@v4
      with:
        name: heals-log
        path: shard-logs
      # No artifact exists at all when nothing needed healing this run (the upload step above
      # uses if-no-files-found: ignore) — that's the common case, not a failure.
      continue-on-error: true

    - name: Apply healed selectors
      run: npx tamash-playwright apply-heals --logs-dir shard-logs

    # Skip the (expensive) verify-and-PR steps entirely when apply-heals found nothing to fix —
    # by far the common case. `git diff --quiet` exits 1 the moment it finds a difference.
    - name: Check whether any fixes were applied
      id: check
      run: echo "changed=$(git diff --quiet || echo true)" >> "$GITHUB_OUTPUT"

    # Proves the *written* fix works standalone, with no safety net — HEALER_ENABLED=false here is
    # deliberate: leaving healing on could let a still-broken selector get silently re-healed at
    # runtime again, which would report green without ever proving the applied source fix was
    # actually correct.
    - name: Install Playwright Browsers
      if: steps.check.outputs.changed == 'true'
      run: npx playwright install --with-deps
    - name: Verify the healed selectors work on their own
      id: verify
      if: steps.check.outputs.changed == 'true'
      run: npx playwright test
      continue-on-error: true
      env:
        HEALER_ENABLED: false
        APP_BASE_URL: https://qtpsudhakar-vibetestq-hrm.up.railway.app/
    - name: Upload verification report
      id: upload-verification-report
      if: steps.check.outputs.changed == 'true' && !cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: apply-heals-verification-report
        path: playwright-report/
        retention-days: 30

    # apply-heals-report.md/.json only ever existed inside this job's own ephemeral checkout —
    # uploaded here so the publish-report job (a separate job, separate checkout) can get at it.
    - name: Upload healing report
      if: steps.check.outputs.changed == 'true' && !cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: healing-report
        path: |
          .tamash-playwright/apply-heals-report.md
          .tamash-playwright/apply-heals-report.json
        retention-days: 30

    # apply-heals writes .tamash-playwright/apply-heals-report.md with a before/after per fix
    # (and skip reasons for anything it couldn't apply) — this prepends the verification result so
    # the PR body ends up as one linked story: what broke, what changed, and whether it's proven to
    # work, rather than three things a reviewer has to go find separately.
    - name: Compose PR body
      if: steps.check.outputs.changed == 'true'
      run: |
        {
          echo "Auto-generated by \`tamash-playwright apply-heals\` after self-healing kicked in during CI."
          echo ""
          if [ "${{ steps.verify.outcome }}" = "success" ]; then
            echo "**Verification run (healing disabled): ✅ all tests passed with these selectors on their own.**"
          else
            echo "**Verification run (healing disabled): ⚠️ one or more tests failed — review carefully before merging.**"
          fi
          echo "[Full test execution report](${{ steps.upload-verification-report.outputs.artifact-url }}) (HTML, with traces/screenshots — sign-in to GitHub required to download)"
          echo ""
          echo "Review each change against the real page before merging — these are AI-suggested replacements for selectors that broke."
          echo ""
          echo "---"
          echo ""
          cat .tamash-playwright/apply-heals-report.md
        } > .tamash-playwright/pr-body.md

    # Opened either way — a failed verification is still worth a human's attention (maybe the fix
    # is right and something else was flaky), it just gets an honest label instead of a silent
    # false-positive. The job below still fails the run itself when verification failed, so CI
    # status stays truthful even though the PR was opened for review.
    # branch/base default to whatever ref this job checked out (github.ref_name) — no explicit
    # base: is set, so the PR targets the source branch itself, not main/master. The branch name
    # is suffixed per source ref so two different branches healing at the same time never fight
    # over the same physical heal branch (each source branch gets its own tamash-playwright/apply-
    # heals-<branch> line; the concurrency group above only serializes runs on the *same* ref).
    - name: Open PR with healed selectors
      if: steps.check.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        commit-message: "fix: apply self-healed selectors from CI"
        title: "Apply self-healed selectors on ${{ github.ref_name }} (verification ${{ steps.verify.outcome == 'success' && 'passed' || 'FAILED' }})"
        body-path: .tamash-playwright/pr-body.md
        branch: tamash-playwright/apply-heals-${{ github.ref_name }}
        delete-branch: true

    - name: Fail the job if verification didn't pass
      if: steps.check.outputs.changed == 'true' && steps.verify.outcome != 'success'
      run: |
        echo "::error::Applied selector fixes did not pass verification — a PR was still opened for review, but check it carefully before merging."
        exit 1

  # Publishes a browsable page combining all three reports from this run, plus every past run's
  # report under history/<run>/ — no GitHub sign-in or zip download required, unlike the raw CI
  # artifacts. The report-history branch is pure storage (never a real Pages "source" in GitHub's
  # settings — Pages here is still "deploy via workflow"): each run checks it out, adds its own
  # snapshot, pushes it back, and deploys the whole accumulated tree as the site. Restricted to
  # main/master pushes — unlike apply-heals, this is a single shared public site, so a
  # feature-branch push shouldn't overwrite it with that branch's report.
  publish-report:
    needs: [test, apply-heals]
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    # GitHub's own recommended group name for Pages deployments — only one deploy can be in
    # flight at a time regardless of which workflow/job triggers it, so two close-together runs
    # queue rather than racing to publish the "latest" site (and racing to push report-history).
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      # contents: write is for pushing this run's snapshot to the report-history branch — separate
      # from and unrelated to the pages/id-token permissions used for the actual Pages deployment.
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    # Needed so compose-report-page.sh (checked into this repo) actually exists in the workspace —
    # this job otherwise only downloads artifacts and clones the separate history branch into
    # _site below, neither of which brings the repo's own scripts along.
    - uses: actions/checkout@v4

    # report-history is storage-only, never configured as this repo's actual Pages source. Cloned
    # via a token-authenticated URL into _site (rather than actions/checkout + ref:, which errors
    # out if the branch doesn't exist yet — exactly the state on the very first run) so it doesn't
    # collide with the source checkout above, which lives at the workspace root.
    - name: Checkout report-history branch
      run: |
        if git clone --depth 1 --branch report-history \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" _site 2>/dev/null; then
          echo "Found existing report-history branch."
        else
          echo "No report-history branch yet — starting one."
          mkdir -p _site
          git -C _site init -q -b report-history
          git -C _site remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
        fi
        git -C _site config user.name "github-actions[bot]"
        git -C _site config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Download initial execution report
      uses: actions/download-artifact@v4
      with:
        name: playwright-report
        path: run-data/initial-run

    - name: Download healing report
      uses: actions/download-artifact@v4
      with:
        name: healing-report
        path: run-data/healing-report
      # Doesn't exist when apply-heals found nothing to fix this run — the common case, not a
      # failure. compose-report-page.sh handles that absence explicitly.
      continue-on-error: true

    - name: Download post-healing verification report
      uses: actions/download-artifact@v4
      with:
        name: apply-heals-verification-report
        path: run-data/post-healing-run
      continue-on-error: true

    # Pulled into its own file rather than inlined — a heredoc's closing delimiter has to sit at
    # column 0 to be recognized unless using tab-only indentation (<<-), which conflicts with this
    # file's space-indented YAML block scalar. See the script's own header for more.
    - name: Compose report page
      run: bash .github/scripts/compose-report-page.sh

    - name: Commit report history
      working-directory: _site
      run: |
        git add -A
        if git diff --cached --quiet; then
          echo "No history changes to commit."
        else
          git commit -q -m "Archive report for run #${{ github.run_number }} (${{ github.sha }})"
          git push -q origin HEAD:report-history
        fi

    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: _site
    - id: deployment
      uses: actions/deploy-pages@v4
